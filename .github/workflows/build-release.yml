name: Build Release App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Decode keystore into android/app/ so Gradle can find it via relative path
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \n\r' | base64 --decode > android/app/upload-keystore.jks

      # key.properties goes in android/ (root Android project dir) — matches build.gradle.kts
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # Verify signing assets are in place before building
      - name: Verify signing setup
        run: |
          echo "=== key.properties (values masked) ==="
          cat android/key.properties | sed 's/=.*/=***/'
          echo "=== Keystore file ==="
          ls -lh android/app/upload-keystore.jks

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Locate built .aab
        if: always()
        run: find build -name "*.aab" 2>/dev/null && echo "---" || echo "No .aab file found anywhere in build/"

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: nothing-calculator-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
