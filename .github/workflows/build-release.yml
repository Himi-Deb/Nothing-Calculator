name: Build Release App Bundle

on:
  # Run manually from GitHub Actions tab
  workflow_dispatch:
  # Also run automatically on every push to main
  push:
    branches:
      - main

jobs:
  build:
    name: Build Signed AAB
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (required by Android SDK)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # 4. Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 5. Decode the keystore from the GitHub Secret (stored as base64)
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 6. Create key.properties from secrets
      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # 7. Update build.gradle.kts to use relative path (CI path)
      - name: Patch storeFile path for CI
        run: |
          sed -i 's|storeFile = file(keyProperties\["storeFile"\] as String)|storeFile = file("${"$"}{projectDir}/${keyProperties["storeFile"] as String}")|' android/app/build.gradle.kts

      # 8. Build the release App Bundle
      - name: Build App Bundle
        run: flutter build appbundle --release

      # 9. Upload the .aab as a downloadable artifact
      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: nothing-calculator-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
